---
# Runs when you click "Deploy HEAD Commit" in cPanel's Git Version Control.
# cPanel joins these tasks into one bash script, so exports carry across lines.
deployment:
  tasks:
    - export DEPLOYPATH=/home3/larva/segundaitzel.mx/

    # Shared cPanel does not put node/npm on the deploy PATH. These are the
    # usual EasyApache locations; harmless if a directory does not exist.
    - export PATH="/opt/cpanel/ea-nodejs22/bin:/opt/cpanel/ea-nodejs20/bin:/opt/cpanel/ea-nodejs18/bin:$PATH"

    # Build on the server if node is available. If npm is missing, or the build
    # is killed by the account's memory limit, fall back to the dist/ committed
    # in this repo rather than aborting the deploy and leaving the site stale.
    - npm ci --no-audit --no-fund && npm run build || echo "SERVER BUILD SKIPPED - deploying committed dist/"

    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R dist/. $DEPLOYPATH
