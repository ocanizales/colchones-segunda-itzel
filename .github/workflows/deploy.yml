name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to the document root at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Uploads only the files that changed since the last deploy; state lives
      # in .ftp-deploy-sync-state.json on the server. Delete that file to force
      # a full re-upload.
      - name: Upload dist/ to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          # server-dir is relative to wherever the FTP account lands on login,
          # NOT an absolute filesystem path. A main cPanel login (user "larva")
          # lands in /home3/larva, so the target is segundaitzel.mx/. If you
          # instead create a domain-scoped FTP account that lands directly in
          # /home3/larva/segundaitzel.mx, change this to ./
          server-dir: segundaitzel.mx/
