name: Verify dist is current

# Deployment itself happens in cPanel (Git Version Control → Deploy HEAD Commit),
# which copies files but cannot build. That makes a committed dist/ load-bearing:
# if someone edits src/ and forgets to rebuild, cPanel would happily deploy the
# previous version and the change would silently never go live. This job rebuilds
# from source and fails if the result differs from what was committed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Rebuild from source
        run: npx vite build --outDir /tmp/dist-check

      # Vite fingerprints assets by content, so a byte-identical tree means the
      # committed build really was produced from the committed source.
      - name: Compare against committed dist/
        run: |
          if ! diff -r dist /tmp/dist-check; then
            echo "::error::dist/ is stale. Run 'npm run build' and commit the result."
            exit 1
          fi
          echo "dist/ matches source."
