name: Build & Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys write to the document root at the same time.
concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      # Uploads only the files that changed since the last deploy; state lives
      # in .ftp-deploy-sync-state.json on the server. Delete that file to force
      # a full re-upload.
      - name: Upload dist/ to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          # FTP_SERVER must be the server's own hostname
          # (gator3011.hostgator.com), NOT the account's IP. HostGator serves a
          # *.hostgator.com certificate, so connecting by IP fails strict TLS
          # verification on a name mismatch. The hostname resolves to a
          # different IP than the site does — same machine, main IP vs shared
          # IP — and reaches the same account.
          local-dir: ./dist/
          # server-dir is relative to wherever the FTP account lands on login,
          # NOT an absolute filesystem path. The deploy account is scoped to
          # /home3/larva/segundaitzel.mx, so it starts in the document root and
          # the target is ./ — this uploads the CONTENTS of dist/, not the
          # folder itself. If you ever switch to the main cPanel login (which
          # lands in /home3/larva), this must become segundaitzel.mx/ instead.
          server-dir: ./
