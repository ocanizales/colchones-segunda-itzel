<!DOCTYPE html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Search Console ownership. Kept as a meta tag rather than a DNS TXT record
      or an uploaded HTML file: it lives in the repo, so it survives every
      rebuild and redeploy. Google re-checks periodically and silently
      unverifies the property if the token disappears — which is exactly what
      happens when a verification file gets wiped by an FTP sync. Do not remove.
    -->
    <meta
      name="google-site-verification"
      content="zrO0BAQAwru700sOBni0Kx5IowZeL_U5oxJ0pXnmSC4"
    />

    <title>Colchones y Bases en Mexicali | Colchones Segunda Itzel</title>
    <meta
      name="description"
      content="Colchones, bases y todo para tu recámara en Mexicali. Memory foam ortopédico, pillow top y bases resistentes. Visítanos en Río Sena o escríbenos por WhatsApp."
    />
    <link rel="canonical" href="https://segundaitzel.mx/" />
    <meta name="theme-color" content="#1B4F8A" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Colchones Segunda Itzel" />
    <meta property="og:locale" content="es_MX" />
    <meta property="og:url" content="https://segundaitzel.mx/" />
    <meta property="og:title" content="Colchones y Bases en Mexicali | Colchones Segunda Itzel" />
    <meta
      property="og:description"
      content="Colchones, bases y todo para tu recámara en Mexicali. Visítanos en Local 16, Río Sena, o escríbenos por WhatsApp."
    />
    <!-- TODO: replace with a real photo of the store at /og-image.jpg (1200x630). -->
    <meta
      property="og:image"
      content="https://images.unsplash.com/photo-1692455067486-d4637182a61c?w=1200&h=630&fit=crop&auto=format"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Recámara con colchón y base de Colchones Segunda Itzel" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!--
      Fonts are loaded here, not via @import in fonts.css. Tailwind v4 emits its
      own @import first, which made the remote @import invalid per the CSS spec
      (remote imports must precede all other rules), so the bundler silently
      dropped it and Fraunces/Nunito never loaded in production — the page fell
      back to Georgia. Linking from the head also lets the preload scanner start
      the fetch immediately instead of waiting on the CSS round-trip.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,700&family=Nunito:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;0,800;1,700&family=Nunito:wght@400;500;600;700&display=swap"
      />
    </noscript>

    <!--
      FurnitureStore is the correct Schema.org subtype for a mattress retailer;
      a generic LocalBusiness scores worse for rich results.
      Still omitted rather than guessed: priceRange, aggregateRating. See README.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FurnitureStore",
        "@id": "https://segundaitzel.mx/#store",
        "name": "Colchones Segunda Itzel",
        "url": "https://segundaitzel.mx/",
        "description": "Venta de colchones, bases de cama y artículos de recámara en Mexicali, Baja California.",
        "telephone": "+52-686-352-9089",
        "image": "https://images.unsplash.com/photo-1692455067486-d4637182a61c?w=1200&h=630&fit=crop&auto=format",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Local 16, Río Sena, Col. Virreyes",
          "addressLocality": "Mexicali",
          "addressRegion": "BC",
          "postalCode": "21190",
          "addressCountry": "MX"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 32.6179382,
          "longitude": -115.5212309
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Thursday", "Friday", "Saturday", "Sunday"],
            "opens": "09:00",
            "closes": "16:00"
          }
        ],
        "areaServed": { "@type": "City", "name": "Mexicali" },
        "hasMap": "https://maps.google.com/?q=32.6179382,-115.5212309",
        "currenciesAccepted": "MXN",
        "knowsLanguage": ["es-MX", "en"],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Catálogo",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Product", "name": "Memory Foam Ortopédico" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Product", "name": "Colchón Pillow Top" }
            },
            {
              "@type": "Offer",
              "itemOffered": { "@type": "Product", "name": "Base de Cama" }
            }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
